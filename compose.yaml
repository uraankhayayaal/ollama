services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_rag
    ports:
      - "6333:6333" # REST API и Web UI
      - "56334:6334" # gRPC API (используется приложением, QDRANT_ADDR)
    volumes:
      - qdrant:/qdrant/storage
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ollama-redis
    restart: unless-stopped
    ports:
      - "56379:6379" # REDIS_ADDR / BOARD_REDIS_ADDR
    volumes:
      - redis:/data
    # AOF для durability чекпоинтов планировщика
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  qdrant: {}
  redis: {}